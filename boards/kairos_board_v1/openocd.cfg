# KairOS Board v1 — OpenOCD template
# Edit adapter and target for your hardware.

source [find interface/cmsis-dap.cfg]
# source [find interface/jlink.cfg]

transport select jtag

# Replace with your RISC-V target when silicon is chosen:
# source [find target/riscv.cfg]

adapter speed 1000

init
halt

echo {KairOS Board v1 — connected. Use gdb_init.gdb}
